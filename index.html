<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amy Liu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d0f url("amy.jpg") center/cover no-repeat fixed;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55));
      z-index: 0;
    }
    main { position: relative; z-index: 1; }
    h1 {
      font-size: clamp(2.5rem, 9vw, 5rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 20px rgba(0,0,0,.5);
    }
    .roles {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem 2.25rem;
    }
    .role {
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      opacity: 0.85;
      border-bottom: 1px solid rgba(255,255,255,.4);
      padding: 0 0 2px;
      transition: opacity .2s ease;
    }
    .role:hover { opacity: 1; }

    /* Lightbox overlay */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem 1rem;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease, visibility .3s ease;
    }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lightbox img {
      max-width: min(92vw, 520px);
      max-height: 82vh;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      transform: scale(.96);
      transition: transform .3s ease;
    }
    .lightbox.open img { transform: scale(1); }
    .lightbox .actions {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    .lightbox .actions a {
      color: #fff;
      text-decoration: none;
      font-size: .85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
      transition: opacity .2s ease;
    }
    .lightbox .actions a:hover { opacity: 1; }
    .lightbox .close {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity .2s ease;
    }
    .lightbox .close:hover { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <h1>Amy Liu</h1>
    <nav class="roles">
      <button class="role" onclick="openCard()">Model</button>
      <a class="role" href="#" onclick="return false">DJ</a>
      <a class="role" href="#" onclick="return false">Artist</a>
      <a class="role" href="https://github.com/amyzliu" target="_blank" rel="noopener">Engineer</a>
    </nav>
  </main>

  <div class="lightbox" id="lightbox" onclick="if(event.target===this)closeCard()">
    <button class="close" onclick="closeCard()" aria-label="Close">&times;</button>
    <img src="comp-card.jpg" alt="Amy Liu comp card">
    <div class="actions">
      <a href="comp-card.pdf" target="_blank" rel="noopener">Download PDF</a>
    </div>
  </div>

  <script>
    var lb = document.getElementById('lightbox');
    function openCard() { lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeCard() { lb.classList.remove('open'); document.body.style.overflow = ''; }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeCard();
    });
  </script>
</body>
</html>
